<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brew &amp; Blossom | Premium Coffee &amp; Florals</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css"
    />

    <style>
      :root {
        --primary-green: #1c3c2d;
        --accent-yellow: #ffc107;
        --white: #ffffff;
      }

      body {
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #fcfcfc;
        margin: 0;
        padding: 0;
      }

      /* Extra Large Dark Green Header */
      .navbar {
        position: sticky;
        top: 0;
        z-index: 1000;
        background-color: var(--primary-green) !important;
        padding-top: 1.2rem !important;
        padding-bottom: 1.2rem !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
      }

      /* Brand Container (Logo + Text) */
      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-right: 0;
        transition: opacity 0.3s ease;
      }

      .navbar-brand:hover {
        opacity: 0.9;
      }

      .brand-text {
        font-size: 2rem;
        font-weight: 800;
        color: var(--white);
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1;
      }

      /* Extra Large Header Logo with Dynamic Scaling */
      .header-logo {
        height: 100px;
        width: auto;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        transition: height 0.3s ease;
      }

      /* Navigation Icons */
      .nav-link i {
        font-size: 2rem !important;
        color: var(--white) !important;
        transition: all 0.2s ease;
      }

      .nav-link:hover i {
        color: var(--accent-yellow) !important;
        transform: translateY(-3px);
      }

      /* Register Custom Hover Effect */
      .btn-register {
        background-color: var(--primary-green);
        color: white;
        transition: all 0.3s ease;
      }

      .btn-register:hover {
        background-color: #12281e;
        color: var(--accent-yellow);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--primary-green);
        border-radius: 5px;
      }

      /* Responsive Breakpoints */
      @media (max-width: 576px) {
        .header-logo {
          height: 60px;
        }
        .navbar {
          padding-top: 0.6rem !important;
          padding-bottom: 0.6rem !important;
        }
        .brand-text {
          font-size: 1.4rem;
        }
        /* Adjust double layout wrappers for small viewports */
        .register-section {
          padding-top: 3rem !important;
          padding-bottom: 3rem !important;
          height: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="home.html">
          <img
            src="register_files/bnb.png"
            alt="BNB Logo"
            class="header-logo"
          />
          <div class="brand-text d-none d-sm-block">
            Brew
            <span style="font-weight: 300; opacity: 0.9">&amp;</span> Blossom
          </div>
        </a>

        <div class="ms-auto d-flex align-items-center">
          <ul class="navbar-nav flex-row gap-4">
            <li class="nav-item">
              <a class="nav-link p-0" href="shop.html" title="Go to Shop">
                <i class="bi bi-grid-3x3-gap"></i>
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link p-0 position-relative"
                href="cart.html"
                title="View Cart"
              >
                <i class="bi bi-bag-heart"></i>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link p-0" href="login.html" title="Login">
                <i class="bi bi-person-circle"></i>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <div
        class="min-vh-100 d-flex align-items-center justify-content-center register-section"
        style="background-color: var(--primary-green)"
      >
        <div class="col-12 col-sm-8 col-md-6 col-lg-4 px-4 py-5">
          <div class="text-center mb-4">
            <img
              src="register_files/bnb.png"
              alt="Brew &amp; Blossom Logo"
              style="
                max-width: 160px;
                height: auto;
                filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.3));
              "
            />
          </div>

          <div class="card border-0 shadow-lg p-3" style="border-radius: 25px">
            <div class="card-body">
              <div class="text-center mb-4">
                <h2 class="fw-bold mb-1" style="color: var(--primary-green)">
                  Join Us
                </h2>
                <p class="text-muted small">
                  Create your account to start shopping
                </p>
              </div>

              <form action="http://127.0.0.1:8000/register" method="POST">
                <input
                  type="hidden"
                  name="_token"
                  value="yII9yZQNlfcrseKUJ4q9mSaDHsFOGPyqREPBoTu5"
                  autocomplete="off"
                />

                <div class="mb-3">
                  <label class="form-label small fw-bold ms-2">Full Name</label>
                  <input
                    type="text"
                    name="name"
                    class="form-control rounded-pill border-0 bg-light py-2 px-3"
                    placeholder="John Doe"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold ms-2"
                    >Email Address</label
                  >
                  <input
                    type="type"
                    name="email"
                    class="form-control rounded-pill border-0 bg-light py-2 px-3"
                    placeholder="john@example.com"
                    value="abasahmad@gmail.com"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold ms-2">Password</label>
                  <input
                    type="password"
                    name="password"
                    class="form-control rounded-pill border-0 bg-light py-2 px-3"
                    placeholder="Minimum 8 characters"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label small fw-bold ms-2"
                    >Confirm Password</label
                  >
                  <input
                    type="password"
                    name="password_confirmation"
                    class="form-control rounded-pill border-0 bg-light py-2 px-3"
                    placeholder="Repeat your password"
                    required
                  />
                </div>

                <button
                  type="submit"
                  class="btn btn-register w-100 rounded-pill py-2 fw-bold shadow-sm mb-2"
                >
                  Register Now
                </button>
              </form>

              <div class="text-center mt-3 pt-3 border-top">
                <p class="small text-muted mb-0">Already a member?</p>
                <a
                  href="login.html"
                  class="fw-bold text-decoration-none"
                  style="color: var(--primary-green)"
                  >Sign In Instead</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-5">
      <div class="container text-center">
        <img
          src="register_files/bnb.png"
          alt="BNB Logo"
          style="
            height: 60px;
            margin-bottom: 15px;
            filter: grayscale(1);
            opacity: 0.2;
          "
        />
        <p class="fw-bold mb-1" style="color: var(--primary-green)">
          BREW &amp; BLOSSOM
        </p>
        <p class="text-muted small mb-0">
          © 2026 Premium Drinks &amp; Floral Boutique. All rights reserved.
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
