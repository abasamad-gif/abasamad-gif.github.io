<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew &amp; Blossom | Premium Coffee &amp; Florals</title>
    
    <link href="cart_files/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="cart_files/bootstrap-icons.css">
    
    <style>
        :root {
            --primary-green: #1c3c2d;
            --accent-yellow: #ffc107;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fcfcfc;
            margin: 0;
            padding: 0;
        }

        /* Extra Large Dark Green Header */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--primary-green) !important;
            padding-top: 1.2rem !important;
            padding-bottom: 1.2rem !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* Brand Container (Logo + Text) */
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 20px; 
            margin-right: 0;
            transition: opacity 0.3s ease;
        }

        .navbar-brand:hover {
            opacity: 0.9;
        }

        .brand-text {
            font-size: 2rem;
            font-weight: 800;
            color: var(--white);
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1;
        }

        /* Extra Large Header Logo */
        .header-logo {
            height: 100px; /* Your requested size */
            width: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        /* Navigation Icons */
        .nav-link i {
            font-size: 2rem !important;
            color: var(--white) !important;
            transition: all 0.2s ease;
        }

        .nav-link:hover i {
            color: var(--accent-yellow) !important;
            transform: translateY(-3px);
        }

        /* Cart Badge */
        .badge-cart {
            background-color: var(--accent-yellow);
            color: #000;
            font-size: 0.8rem;
            font-weight: bold;
            border: 2px solid var(--primary-green);
        }

        /* Main Content Spacing */
        main {
            min-height: 85vh;
        }

        /* Footer */
        footer {
            background-color: var(--white);
            color: var(--primary-green);
            border-top: 1px solid #eee;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-green);
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            
            <a class="navbar-brand" href="http://127.0.0.1:8000/home">
                <img src="cart_files/bnb.png" alt="BNB Logo" class="header-logo">
                <div class="brand-text d-none d-sm-block">
                    Brew <span style="font-weight: 300; opacity: 0.9;">&amp;</span> Blossom
                </div>
            </a>

            <div class="ms-auto d-flex align-items-center">
                <ul class="navbar-nav flex-row gap-4">
                    <li class="nav-item">
                        <a class="nav-link p-0" href="http://127.0.0.1:8000/shop" title="Go to Shop">
                            <i class="bi bi-grid-3x3-gap"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link p-0 position-relative" href="http://127.0.0.1:8000/cart" title="View Cart">
                            <i class="bi bi-bag-heart"></i>
                                                    </a>
                    </li>
                                            <li class="nav-item">
                            <a class="nav-link p-0" href="http://127.0.0.1:8000/logout" title="Logout">
                                <i class="bi bi-person-x"></i>
                            </a>
                        </li>
                                    </ul>
            </div>

        </div>
    </nav>

    <main>
        <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">Your Shopping Cart 🛒</h2>
            </div>

            <div class="text-center py-5 border rounded-4 bg-light">
            <div class="display-1 mb-3">🛍️</div>
            <h4 class="text-muted">Your cart is feeling a bit light.</h4>
            <p class="mb-4">Go fill it up with some coffee or flowers!</p>
            <a href="http://127.0.0.1:8000/shop" class="btn btn-danger rounded-pill px-5 py-2">Start Shopping</a>
        </div>
    </div>
    </main>

    <footer class="py-5">
        <div class="container text-center">
            <img src="cart_files/bnb.png" alt="BNB Logo" style="height: 60px; margin-bottom: 15px; filter: grayscale(1); opacity: 0.2;">
            <p class="fw-bold mb-1" style="color: var(--primary-green);">BREW &amp; BLOSSOM</p>
            <p class="text-muted small mb-0">© 2026 Premium Drinks &amp; Floral Boutique. All rights reserved.</p>
        </div>
    </footer>

    <script src="cart_files/bootstrap.bundle.min.js"></script>

</body></html>
